        if (!name || !contact) { this.setState({ ferr: 'Вкажи ім’я та Telegram або телефон', sent: false }); return; }
        const msg = 'Заявка з сайту ITishniki\nІм’я: ' + name + '\nКонтакт: ' + contact + '\nКурс: ' + course;
        const tgLink = 'https://t.me/' + TG_USER + '?text=' + encodeURIComponent(msg);
        const done = (viaBot) => this.setState({ ferr: '', sent: true, sending: false, tgLink: tgLink,
          sentNote: viaBot ? 'Ми напишемо тобі найближчим часом (з 8:00 до 20:00). Хочеш швидше — напиши нам у Telegram.' : 'Натисни кнопку нижче — відкриється наш Telegram з готовим повідомленням (текст також скопійовано).' });
        try { if (navigator.clipboard) navigator.clipboard.writeText(msg).catch(() => {}); } catch (_) {}
        if (!LEAD_ENDPOINT) { done(false); return; }
        this.setState({ sending: true, ferr: '' });
        try {
          fetch(LEAD_ENDPOINT, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ name: name, contact: contact, course: course }) })
            .then(() => done(true), () => done(false));
        } catch (_) { done(false); }
      },
      courseOpts: ['Німецька', 'Французька', 'IT', 'Словацька', 'Ще не знаю'].map((c) => {
        const L = { 'Німецька': LANGS[0], 'Французька': LANGS[1], 'IT': LANGS[2], 'Словацька': LANGS[3] }[c] || { bg: '#F2F2EE', fg: '#09090B' };
        const on = (s.fc || 'Німецька') === c;
        return { label: c, on: on ? 'true' : 'false', pick: () => this.setState({ fc: c }),
          style: 'min-height: 44px; padding: 10px 16px; border-radius: 999px; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer; transition: background .2s ease, color .2s ease, border-color .2s ease; ' +
            (on ? 'background:' + L.bg + '; color:' + L.fg + '; border: 1px solid ' + L.bg : 'background: #121215; color: #F2F2EE; border: 1px solid #26262B') };
      }),
      rootRef: (el) => { this.rootEl = el; }, curRef: (el) => { this.cur = el; }, progRef: (el) => { this.prog = el; },
      deckStyle: 'flex: 1 1 400px; min-width: 0; position: relative; height: 500px; display: flex; align-items: flex-end; justify-content: center; transition: transform .25s ease-out; transform: perspective(1400px) rotateY(' + (((s.mx / s.w) - 0.6) * 16).toFixed(2) + 'deg) rotateX(' + ((0.5 - (s.my / s.h)) * 10).toFixed(2) + 'deg)',
      team: LANGS.map(L => ({ subj: L.k === 'it' ? 'IT / Python' : L.name,
        card: '--a:' + L.bg + '; background: #121215; border: 1px solid #26262B; border-radius: 28px; overflow: hidden; display: flex; flex-direction: column',
        photo: 'height: 260px; display: flex; align-items: center; justify-content: center; background:' + L.bg + '; color:' + L.fg,
        tag: 'align-self: flex-start; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 800; background:' + L.bg + '; color:' + L.fg })),
      mq1: (el) => { this.m1 = el; }, mq2: (el) => { this.m2 = el; },
      word: A.word, wordColor: A.bg, deck, dots, tabs, shown, langs,
      perks: ['Живі викладачі, не записи', 'Онлайн з будь-якої країни', 'Розклад під тебе', 'Перший урок безкоштовно'],
      typed: TERM.slice(0, Math.min(s.ti, TERM.length)),
      src: PHRASES[s.ph].src, out: out.slice(0, s.ci), outLabel: (s.lang === 'it' ? 'PYTHON' : T.name.toUpperCase()),
      outStyle: 'background:' + T.bg + '; color:' + T.fg + '; border-radius: 24px; padding: 28px; min-height: 160px; box-sizing: border-box; transition: background .35s ease, color .35s ease',
      outText: 'margin-top: 12px; font-size: clamp(22px, 2.4vw, 34px); line-height: 1.2; font-weight: 900; font-family:' + (s.lang === 'it' ? "'JetBrains Mono', monospace" : 'Unbounded, sans-serif'),
      nextPhrase: () => this.setState({ ph: (s.ph + 1) % PHRASES.length, ci: 0 }),
      move: (e) => { const r = e.currentTarget.getBoundingClientRect(); this.setState({ mx: e.clientX - r.left, my: e.clientY - r.top, w: r.width, h: r.height }); },
      spot: 'position: absolute; left: ' + s.mx + 'px; top: ' + s.my + 'px; width: 560px; height: 560px; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, rgba(198,255,61,.13), rgba(198,255,61,0) 60%); pointer-events: none; transition: left .2s ease-out, top .2s ease-out'
    };
  }
}

render(h(App, {}), document.getElementById('app'));
}
</script>
